host: dummy-domain.com

production: false
version: ''
repository: 812222239604.dkr.ecr.eu-central-1.amazonaws.com

eapi:
  metadata:
    name: environmental-api
    config: environmental-api-config
  config:
    log_level: 'info'
  port: 3000
  targetPort: 3000
  replicas: 3
  image:
    name: ens-api
    pullPolicy: IfNotPresent
    tag: 'v1.0.1'
  hpa_config:
    minReplicas: 2
    maxReplicas: 15
    cpu_averageUtilization: 60
    memory_averageUtilization: 60
    stabilizationWindowSeconds: 60
  resources:
    requests_memory: '400Mi'
    requests_cpu: '200m'
    limits_memory: '400Mi'
    limits_cpu: '200m'
   
  

nodeSelector:
  karpenter.sh/capacity-type: "spot"
tolerations:
- key: "karpenter.sh/capacity-type"
  operator: "Equal"
  value: "spot"

maxSkew: 1 # maxSkew is the maximum allowed difference in the number of pods in any two availability zones
